name: Secret scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly full-history sweep: a credential can also enter through a direct push,
    # and third-party scanners index public repositories within hours.
    - cron: "0 3 * * 1"

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.30.1"

jobs:
  gitleaks:
    name: gitleaks (entire history)
    runs-on: ubuntu-latest
    steps:
      - name: Check out every commit, not just the tip
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan every commit for credentials
        run: gitleaks git --redact --verbose --config .gitleaks.toml --exit-code 1
