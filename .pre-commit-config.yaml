# Install once per clone:
#
#     pipx install pre-commit && pre-commit install
#
# and install the scanner it calls (a single static binary):
#
#     https://github.com/gitleaks/gitleaks/releases
#
# The hook scans staged changes, so a token pasted into a test or a config file is
# rejected before it ever reaches the remote. It uses the `gitleaks-system` hook
# rather than the default `gitleaks` hook because the latter is built with
# `language: golang` and requires a Go toolchain on the machine.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks-system
        # Upstream omits this on the -system hook, and pre-commit would then append
        # the changed paths as positional arguments, which `gitleaks git` rejects.
        pass_filenames: false
